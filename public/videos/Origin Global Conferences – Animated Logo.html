<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Origin Global Conferences – Animated Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060609;--gold:#ffb400;--gold2:#ffd36b;--ink:#ffffff;--shell:#f1d9b0;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#060609}}
:root:not([data-theme="light"]){--bg:#060609}
:root[data-theme="dark"]{--bg:#060609}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:Montserrat,"Helvetica Neue",Arial,sans-serif}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:size;overflow:hidden;
 background:radial-gradient(ellipse 60% 55% at 50% 50%,#1a1408 0%,#0b0a0d 55%,#060609 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.glow{position:absolute;left:50%;top:48%;width:70cqw;height:70cqw;translate:-50% -50%;border-radius:50%;
 background:radial-gradient(circle,rgba(255,180,0,.28),rgba(255,180,0,0) 62%);opacity:0}
.go .glow{animation:glowIn 1.6s 1.7s ease-out both,breathe 5s 3.3s ease-in-out infinite}
.logo{position:absolute;left:50%;top:44%;translate:-50% -50%;display:flex;align-items:center;gap:1.2cqw;z-index:2}
.eggwrap{position:relative;width:17cqw}
.eggwrap img{display:block;width:100%}
.d,.w{will-change:transform}
.go .d{animation:drop 1.1s cubic-bezier(.3,.9,.3,1) both}
.go .w{animation:wob .9s 1.05s ease-in-out both,pop .6s 1.75s cubic-bezier(.2,1.6,.4,1) both}
.go .eggwrap img{animation:float 4s 2.4s ease-in-out infinite;filter:drop-shadow(0 2cqw 2cqw rgba(255,170,0,.25))}
.ring{position:absolute;left:50%;top:45%;width:6cqw;height:6cqw;translate:-50% -50%;border-radius:50%;border:.35cqw solid var(--gold2);opacity:0}
.go .ring{animation:ring 1.3s 1.75s ease-out both}
.word{display:flex;font-weight:800;font-size:17cqw;line-height:1;letter-spacing:.01em}
.word span{display:block;color:transparent;background:linear-gradient(110deg,#fff 42%,var(--gold2) 50%,#fff 58%) 100% 0/260% 100%;
 -webkit-background-clip:text;background-clip:text;opacity:0}
.go .word span{animation:letter .8s calc(1.95s + var(--i)*.13s) cubic-bezier(.2,.9,.2,1) both,shim 5s calc(4.2s + var(--i)*.08s) ease-in-out infinite}
.sub{position:absolute;left:50%;top:58%;translate:-50% 0;width:70cqw;display:flex;align-items:center;gap:1.8cqw;z-index:2}
.sub i{flex:1;height:.55cqw;background:var(--gold);transform:scaleX(0);opacity:0;box-shadow:0 0 1.2cqw rgba(255,180,0,.6)}
.sub i:first-child{transform-origin:right}.sub i:last-child{transform-origin:left}
.go .sub i{animation:line .9s 2.9s cubic-bezier(.2,.9,.2,1) both}
.sub b{font-weight:300;font-size:2.1cqw;color:#fff;letter-spacing:.16em;white-space:nowrap;opacity:0;margin-right:-.16em}
.go .sub b{animation:tag 1.4s 3.1s cubic-bezier(.2,.9,.2,1) both}
button{position:absolute;right:2cqw;bottom:2cqw;z-index:9;font:600 1.5cqw Montserrat,Arial,sans-serif;letter-spacing:.15em;color:#fff;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,180,0,.6);border-radius:99px;padding:.8cqw 2cqw;cursor:pointer}
button:hover{background:rgba(255,180,0,.25)}
@keyframes drop{0%{transform:translateY(-70cqh) scale(.9,1.1)}55%{transform:translateY(0) scale(1.12,.86)}72%{transform:translateY(-6cqh) scale(.96,1.05)}86%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}35%{transform:rotate(6deg)}55%{transform:rotate(-9deg) scale(1.02)}75%{transform:rotate(8deg) scale(1.04)}90%{transform:rotate(-3deg) scale(1.05)}}
@keyframes pop{0%{transform:scale(1)}100%{transform:scale(1)}40%{transform:scale(1.14)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.2cqw) rotate(1.5deg)}}
@keyframes ring{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(9)}}
@keyframes glowIn{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes letter{0%{opacity:0;transform:translate(-3cqw,2cqw) scale(.85);filter:blur(1.2cqw)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes shim{0%,55%{background-position:100% 0}90%,100%{background-position:0% 0}}
@keyframes line{0%{opacity:1;transform:scaleX(0)}100%{opacity:1;transform:scaleX(1)}}
@keyframes tag{0%{opacity:0;letter-spacing:.5em;filter:blur(.4cqw)}100%{opacity:1;letter-spacing:.16em;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>

<script>
const stage=document.getElementById('stage'),cv=document.getElementById('fx'),cx=cv.getContext('2d'),egg=document.getElementById('egg');
let P=[],D=[],T;
function size(){const r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}
function dust(){const r=stage.getBoundingClientRect();D=Array.from({length:45},()=>({x:Math.random()*r.width,y:Math.random()*r.height,s:.4+Math.random()*1.6,v:.15+Math.random()*.4,p:Math.random()*6}))}
function burst(){const s=stage.getBoundingClientRect(),e=egg.getBoundingClientRect(),x=e.left-s.left+e.width*.5,y=e.top-s.top+e.height*.45;
 for(let i=0;i<130;i++){const a=Math.random()*6.283,v=2+Math.random()*10,sh=i<60;
  P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,l:1,d:.007+Math.random()*.012,r:sh?3+Math.random()*6:1.5+Math.random()*3.5,sh,rot:Math.random()*6,vr:(Math.random()-.5)*.4})}}
function loop(){const r=stage.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);
 cx.globalCompositeOperation='lighter';
 for(const d of D){d.y-=d.v;d.p+=.02;if(d.y<-5){d.y=r.height+5;d.x=Math.random()*r.width}
  cx.globalAlpha=.25+.2*Math.sin(d.p);cx.fillStyle='#ffc94d';cx.beginPath();cx.arc(d.x,d.y,d.s,0,6.283);cx.fill()}
 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.985;p.rot+=p.vr;p.l-=p.d;if(p.l<=0)continue;
  cx.globalAlpha=Math.max(p.l,0);
  if(p.sh){cx.globalCompositeOperation='source-over';cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle='#f1d9b0';
   cx.beginPath();cx.moveTo(0,-p.r);cx.lineTo(p.r*.9,p.r*.7);cx.lineTo(-p.r*.8,p.r*.5);cx.closePath();cx.fill();cx.restore();cx.globalCompositeOperation='lighter'}
  else{cx.fillStyle='#ffc233';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}}
 P=P.filter(p=>p.l>0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';requestAnimationFrame(loop)}
function play(){stage.classList.remove('go');void stage.offsetWidth;stage.classList.add('go');P=[];clearTimeout(T);T=setTimeout(burst,1750)}
document.getElementById('re').onclick=play;
addEventListener('resize',size);size();dust();loop();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(play);
</script></body></html>
